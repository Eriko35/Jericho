<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamuseo Log In</title>

  <link rel="stylesheet" href="css/stylesheet.css">
  <script type="module" src="js/supabase.js"></script>
</head>

<body class="loginbg">

  <div class="login-container">
    <div class="login-box">
      
      <!-- LOGIN FORM -->
      <div id="loginform" class="loginindex" >
        <img src="css/icons/logo.webp" class="logo">
        <p id="formTitle">Sign In</p>

        <div id="signInMessage" class="messageDiv" style="display:none"></div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="usr-email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="usr-password" placeholder="Enter your password">
        </div>

        <button class="btn-type" id="submitSignIn" type="button">
          Sign In
        </button>

        <p class="link-text">
          Don't have an account?
          <a onclick="switchView('signup')">Sign Up</a>
        </p>
      </div>

      <!-- SIGN UP -->
      <div id="signup" class="loginindex">

        <button class="btn-back" onclick="switchView('signin')">← Back</button>
        <p id="formTitle">Sign Up</p>

        <div id="signUpMessage" class="messageDiv" style="display:none"></div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email-sp" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="fName-sp" placeholder="First name">
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lName-sp" placeholder="Last name">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password-sp" placeholder="Password">
        </div>

        <button class="btn-type" id="submitSignUp" type="button">
          Sign Up
        </button>

      </div>
      
    </div>
  </div>

  <script>
    const loginform = document.getElementById("loginform");
    const signup = document.getElementById("signup");
    const formTitle = document.getElementById("formTitle");

    function hideAll() {
      loginform.style.display = "none";
      signup.style.display = "none";
    }

    function switchView(view) {
      hideAll();

      if (view === "signin") {
        loginform.style.display = "block";
      }
      else {
        signup.style.display = "block";
      }
    }

    // Default view
    switchView("signin");
  </script>

</body>
</html>
